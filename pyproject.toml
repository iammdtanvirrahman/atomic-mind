[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-mind"
version = "0.1.0"
description = "A modular, script-driven conversational AI engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
authors = [{ name = "ATOMIC MIND contributors" }]
dependencies = []

[project.scripts]
atomic-mind = "atomic_mind.__main__:main"

[tool.setuptools.packages.find]
include = ["atomic_mind*"]
